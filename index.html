<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <image id="logo" src="logo1.jpg" alt="logo représentant un homme barbu"></image>
        <div class="display-creation" id="display-creation">
            <h1>To Do List</h1>
            <div class="btn"><button id="new-task" class="new-task" aria-label="new-task-fct">Nouvelle tâche</button><button class="tasks-display-btn" id="tasks-display-btn">Afficher les tâches</button></div>
            <div class="new-task-display hidden" id="new-task-display"><input type="text" class="new-task-input" id="new-task-input" maxlength=40><button class="add-new-task-btn" id="add-new-task-btn">Ajouter</button> </div>
            <div class="tasks-display" id="tasks-display" ></div>            
        </div>        
    </main>
    <script src="script.js"></script>
</body> 
</html>
